<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Link Unavailable" }} - SafeJourney Live</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="error-page-body">
    <div class="error-container">
        <div class="error-icon-box">
            <i class="fa-solid fa-link-slash"></i>
        </div>
        <h1 class="error-title">{{ title or "Sharing Link Inactive" }}</h1>
        <p class="error-message">
            {{ message or "This tracking link has expired, was revoked by the traveler, or never existed." }}
        </p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">
                <i class="fa-solid fa-house"></i> Return to Homepage
            </a>
        </div>
        <div class="error-privacy-note">
            <i class="fa-solid fa-shield-halved"></i> Location links are strictly temporary and revocable at any time by users to guarantee privacy.
        </div>
    </div>
</body>
</html>
